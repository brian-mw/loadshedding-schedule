services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: escom
      POSTGRES_PASSWORD: escom
      POSTGRES_DB: escom
    ports:
      - "5433:5432"
    volumes:
      - escom_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escom -d escom"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://escom:escom@db:5432/escom
      PORT: "3000"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

volumes:
  escom_db_data:

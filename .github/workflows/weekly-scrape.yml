name: Scrape ESCOM loadshedding programme

on:
  schedule:
    # daily at 06:00 UTC - ESCOM's publish day has varied (Mon/Sat/Sun across
    # the already-scraped history), and fetch_escom_pdfs.py is idempotent, so
    # a no-op run on days with nothing new costs nothing.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Each job runs on a fresh runner, so the data/ directory is handed from one
# job to the next as a short-lived artifact, and each job reinstalls the
# (pip-cached) dependencies.
jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # warms the pip cache for the jobs below and fails fast on a broken
      # requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

  fetch:
    name: Fetch PDFs
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Download any new loadshedding PDFs
        run: python pipeline/fetch_escom_pdfs.py --no-parse

      - uses: actions/upload-artifact@v6
        with:
          name: data-fetched
          path: data/
          retention-days: 1

  parse:
    name: Parse
    needs: fetch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - uses: actions/download-artifact@v7
        with:
          name: data-fetched
          path: data/

      - name: Parse any PDFs that haven't been parsed yet
        run: |
          for dir in data/*/; do
            if [ -f "${dir}source.pdf" ] && [ ! -f "${dir}metadata.json" ]; then
              echo "parsing ${dir}"
              python pipeline/parse_escom_pdf.py "${dir}source.pdf" "${dir}"
            fi
          done

      - uses: actions/upload-artifact@v6
        with:
          name: data-parsed
          path: data/
          retention-days: 1

  upload:
    name: Upload to DB
    needs: parse
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - uses: actions/download-artifact@v7
        with:
          name: data-parsed
          path: data/

      - name: Load newest week into Postgres
        # DATABASE_URL secret should be Supabase's DIRECT connection string (port
        # 5432), not the pooled one - this is a single short-lived job, not many
        # concurrent serverless invocations, so pooling isn't needed here (the
        # Fastify API uses the pooled string instead - see api/.env.example).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/load_to_db.py --latest

      - name: Open a PR with any new data files
        # main requires changes via PR (no direct pushes), so this pushes to a
        # throwaway branch and opens + auto-merges a PR instead of pushing
        # straight to main - auto-merge still needs that repo setting enabled,
        # and will stall if the ruleset also requires a human-approved review.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data files - nothing to commit."
            exit 0
          fi
          branch="bot/scraped-data-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "data: add newly scraped loadshedding programme(s)"
          git push origin "$branch"
          pr_url=$(gh pr create --base main --head "$branch" \
            --title "data: add newly scraped loadshedding programme(s)" \
            --body "Automated data update from the weekly scrape workflow.")
          gh pr merge --auto --squash --delete-branch "$pr_url"
